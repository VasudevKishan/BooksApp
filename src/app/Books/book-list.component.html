<div class="h-full">
  <div class="flex justify-between px-8 py-4">
    <h1 class="font-head font-serif text-5xl dark:text-gray-50">
      {{ pageTitle }}
    </h1>
    <div class="flex justify-center items-center">
      <div
        tabindex="1"
        class="w-[255px] h-[50px] rounded-3xl bg-[#f5f7fa] my-[5px] flex justify-center items-center gap-[15px] active:ring-blue-500 active:border-blue-500"
      >
        <i
          class="fa-solid fa-magnifying-glass ml-[25px] my-[15px] text-[20px] text-[#b1b1b1]"
        ></i>
        <input
          [(ngModel)]="listFilter"
          class="w-[152px] text-[15px] bg-transparent my-4 mr-[43px] focus:outline-none"
          type="text"
          placeholder="{{ searchInputPlaceholder }}"
        />
      </div>
    </div>
  </div>

  <hr class="h-px mb-8 border-0 bg-gray-800" />
  <div
    class="m-auto px-5 grid grid-cols-1 grid-flow-row md:grid-cols-2 lg:grid-cols-3 w-full"
  >
    <div
      *ngFor="let book of filteredBooks"
      class="mx-2 px-1 py-3 pb-6 items-center"
    >
      <book-thumbnail [book]="book"></book-thumbnail>
    </div>
  </div>
</div>
