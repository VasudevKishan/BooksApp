<a
  class="flex justify-start w-full px-2 py-2 bg-white border border-gray-200 rounded-lg shadow dark:bg-gray-800 dark:border-gray-700"
>
  <a href="#" class="flex-shrink-0" [routerLink]="['/books', book?.id]">
    <img
      class="rounded-lg w-[150px] h-[250px]"
      src="{{ book?.imageLink }}"
      alt=""
    />
  </a>
  <div class="p-5 w-full flex flex-col justify-between items-center max-h-full">
    <div class="flex-wrap">
      <p class="text-md font-bold">{{ book?.title }}</p>
      <p class="text-xs text-gray-600 font-emph">
        {{ book?.author }},
        <span class="text-gray-500 font-display">{{ book?.year }}</span>
      </p>
      <div>
        <span
          class="bg-blue-100 text-blue-800 text-xs font-medium me-2 px-2.5 py-0.5 rounded dark:bg-blue-900 dark:text-blue-300"
          >{{ book?.language }}</span
        >
      </div>
    </div>

    <button
      type="button"
      [routerLink]="['/books', book?.id]"
      class="self-end text-blue-700 bg-white border border-blue-700 focus:outline-none hover:bg-blue-100 focus:ring-4 focus:ring-blue-100 font-medium rounded-lg text-xs px-2 py-1"
    >
      read more
    </button>
  </div>
</a>
